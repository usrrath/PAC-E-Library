name: pac_e_library_new
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.10.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2
  cupertino_icons: ^1.0.8

  device_info_plus: ^12.4.0
  google_fonts: ^8.1.0
  font_awesome_flutter: ^10.12.0
  cached_network_image: ^3.4.1
  email_validator: ^3.0.0
  page_transition: ^2.2.1
  provider: ^6.1.5+1
  carousel_slider: ^5.1.1
  flutter_spinkit: ^5.2.2
  http: ^1.6.0
  skeletonizer: ^2.1.2

#Bitometic
  local_auth: ^2.3.0
  flutter_secure_storage: ^10.0.0

  flutter_cache_manager: ^3.4.1

  syncfusion_flutter_pdfviewer: ^33.2.6
  syncfusion_pdfviewer_android: ^33.2.6

  crypto: ^3.0.3
  epub_view: ^3.2.0

  epubx: ^4.0.0
  flutter_html: ^3.0.0
  file_picker: ^10.0.0
#  image: ^4.9.0
  image: ^3.3.0
  path_provider: ^2.1.4

  shared_preferences: ^2.5.5
  image_picker: ^1.2.1
  http_parser: ^4.0.2

  change_app_package_name: ^1.4.0
  rename_app: ^1.6.5

#Weather
  dio: ^5.7.0
  geolocator: ^13.0.2

#2FA
  otp: ^3.1.4
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.3
  pretty_qr_code: ^3.5.0
  pin_code_fields: ^8.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.11.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

    - family: KantumruyPro
      fonts:
        - asset: assets/fonts/KantumruyPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/KantumruyPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/KantumruyPro-Bold.ttf
          weight: 700

  assets:
    - assets/icons/
    - assets/icon/